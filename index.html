<title>Cotaí</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: sidebar on desktop, bottom tab bar on phone; one content column with a summary row before detail. */
:root{
  --bg:#f4f6f3; --surface:#ffffff; --surface-2:#eaeee7; --line:#d6dcd1;
  --fg:#1c2420; --fg-2:#55615a; --fg-3:#8a948d;
  --accent:#4e9a2a; --accent-ink:#2f6a16; --accent-soft:#e3f1da;
  --brand:#2a3f4d; --brand-ink:#ffffff;
  --good:#2f7d32; --warn:#b26a00; --bad:#b3261e; --good-soft:#e2f2e3; --warn-soft:#fdf0d6; --bad-soft:#fbe3e1;
  --chart-1:#4e9a2a; --chart-grid:#e1e6dc;
  --font-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius:10px; --shadow:0 1px 2px rgba(20,30,20,.06),0 4px 14px rgba(20,30,20,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a17; --surface:#1d2521; --surface-2:#242e29; --line:#33403a;
  --fg:#e8ede9; --fg-2:#aab5ad; --fg-3:#76827a;
  --accent:#7cc455; --accent-ink:#a9dd8b; --accent-soft:#223a1a;
  --brand:#101a21; --brand-ink:#e8ede9;
  --good:#7cc455; --warn:#f0b24a; --bad:#f08a80; --good-soft:#1f3320; --warn-soft:#3a2d12; --bad-soft:#3d1f1c;
  --chart-1:#7cc455; --chart-grid:#2b3630; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a17; --surface:#1d2521; --surface-2:#242e29; --line:#33403a;
  --fg:#e8ede9; --fg-2:#aab5ad; --fg-3:#76827a;
  --accent:#7cc455; --accent-ink:#a9dd8b; --accent-soft:#223a1a;
  --brand:#101a21; --brand-ink:#e8ede9;
  --good:#7cc455; --warn:#f0b24a; --bad:#f08a80; --good-soft:#1f3320; --warn-soft:#3a2d12; --bad-soft:#3d1f1c;
  --chart-1:#7cc455; --chart-grid:#2b3630; --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:1.5rem}h2{font-size:1.25rem}h3{font-size:1.05rem}
a{color:var(--accent-ink)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--fg-2)}.faint{color:var(--fg-3)}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-3);font-weight:600}

/* shell */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.side{background:var(--brand);color:var(--brand-ink);padding-block:18px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:1.45rem;letter-spacing:.01em}
.logo svg{width:34px;height:34px;flex:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;background:none;border:0;color:inherit;opacity:.78;padding:9px 10px;border-radius:8px;text-align:left;cursor:pointer;min-height:40px}
.nav button svg{width:18px;height:18px;flex:none}
.nav button[aria-current="page"]{background:rgba(255,255,255,.12);opacity:1}
.nav button:hover{opacity:1}
.nav .badge{margin-left:auto;background:var(--accent);color:#fff;font-size:.72rem;font-weight:700;border-radius:99px;padding:1px 7px}
.tenant{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.tenant img{width:100%;max-width:200px;height:auto;display:block}
.tenant small{color:rgba(255,255,255,.55);display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.08em}
.main{min-width:0;padding-block:16px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:900px){.main{padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px));padding-bottom:40px}}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.topbar .actions{display:flex;gap:8px;flex-wrap:wrap}
.tabbar{display:none}
@media (max-width:899px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;align-items:center;padding-block:10px;gap:12px}
  .side .nav,.side .tenant small{display:none}
  .tenant{margin-left:auto}.tenant img{width:auto;height:34px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px));z-index:9;justify-content:space-around}
  .tabbar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.66rem;color:var(--fg-2);padding:4px 6px;min-width:44px;min-height:44px;position:relative;border-radius:8px}
  .tabbar button svg{width:20px;height:20px}
  .tabbar button[aria-current="page"]{color:var(--accent-ink);font-weight:700}
  .tabbar .badge{position:absolute;top:0;right:4px;background:var(--bad);color:#fff;border-radius:99px;font-size:.62rem;padding:0 5px;font-weight:700}
}

/* components */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 13px;cursor:pointer;min-height:40px;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(.95)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:.85rem}
.btn.ghost{border-color:transparent;background:transparent}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;min-width:0}
.card h3{margin-bottom:8px}
.grid{display:grid;gap:12px}
.tiles{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px}
.tile .v{font-family:var(--font-display);font-size:1.8rem;font-weight:700;line-height:1.1;overflow-wrap:anywhere}
.tile .v.money{font-size:1.35rem;padding-top:4px}
.tile .l{font-size:.85rem;color:var(--fg-2)}
.tile.bad .v{color:var(--bad)}.tile.good .v{color:var(--good)}.tile.warn .v{color:var(--warn)}
.cols{grid-template-columns:1fr}
@media (min-width:1100px){.cols{grid-template-columns:3fr 2fr}}
.two{grid-template-columns:1fr}
@media (min-width:760px){.two{grid-template-columns:1fr 1fr}}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:1px 8px;font-size:.75rem;font-weight:700;background:var(--surface-2);color:var(--fg-2);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.acc{background:var(--accent-soft);color:var(--accent-ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;cursor:pointer;font-size:.85rem;min-height:32px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.tablewrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-3);font-weight:600;white-space:nowrap}
td.r,th.r{text-align:right;white-space:nowrap}
td:first-child{min-width:160px}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface-2)}
.best td{background:var(--accent-soft)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600}
.row .s{font-size:.85rem;color:var(--fg-2)}
.stripe{width:4px;align-self:stretch;border-radius:4px;background:var(--line);flex:none}
.stripe.bad{background:var(--bad)}.stripe.warn{background:var(--warn)}.stripe.good{background:var(--good)}.stripe.acc{background:var(--accent)}
.empty{padding:22px;text-align:center;color:var(--fg-2);border:1px dashed var(--line);border-radius:var(--radius)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.8rem;font-weight:600;color:var(--fg-2)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;min-height:40px;width:100%}
.field textarea{min-height:90px}
.form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.form .wide{grid-column:1/-1}
.search{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.search input{flex:1;min-width:180px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;min-height:40px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.sheet{position:fixed;inset:0;background:rgba(10,15,12,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
@media (min-width:760px){.sheet{align-items:center}}
.sheet .panel{background:var(--surface);width:100%;max-width:680px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding-block:16px calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:760px){.sheet .panel{border-radius:14px;padding:20px}}
.panel header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.panel footer{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;z-index:30;box-shadow:var(--shadow)}
@media (min-width:900px){.toast{bottom:28px}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.92rem}
.kv dt{color:var(--fg-2)}.kv dd{margin:0}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:.88rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.banner .btn{min-height:30px;padding:3px 9px;font-size:.82rem}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--fg-2);font-size:11px;font-family:var(--font-body)}
.chart .grid line{stroke:var(--chart-grid)}
.chart .bar{fill:var(--chart-1)}
.chart .bar:hover{opacity:.8}
.hint{font-size:.82rem;color:var(--fg-3)}
.sr{position:absolute;left:-9999px}
.item-head{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:10px}
.spark{width:100%;height:46px;display:block}
.spark path{fill:none;stroke:var(--chart-1);stroke-width:2}
.spark circle{fill:var(--chart-1)}
.pre{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:10px;font-size:.88rem;max-height:220px;overflow:auto}
.steps{display:flex;gap:6px;font-size:.8rem;color:var(--fg-3);margin-bottom:12px;flex-wrap:wrap}
.steps b{color:var(--accent-ink)}
@media (prefers-reduced-motion:no-preference){.sheet .panel{animation:up .18s ease-out}@keyframes up{from{transform:translateY(12px);opacity:.6}}}
</style>

<div class="app">
  <aside class="side">
    <div class="logo" id="brand"></div>
    <nav class="nav" id="nav" aria-label="Seções"></nav>
    <div class="tenant" id="tenant"></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Seções"></nav>
<div id="overlay"></div>
<div id="toast"></div>

/* ===================== utilidades BR ===================== */
const fmtBRL = v => (v==null||isNaN(v)) ? '—' : Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmtNum = (v,d=0) => (v==null||isNaN(v)) ? '—' : Number(v).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtPct = v => (v==null||isNaN(v)) ? '—' : (v>0?'+':'')+Number(v).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%';
function hojeBrasilISO(){ return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()); }
function fmtData(iso){ if(!iso) return '—'; const [y,m,d]=iso.slice(0,10).split('-'); return `${d}/${m}/${y}`; }
function fmtMes(iso){ const [y,m]=iso.split('-'); return ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][+m-1]+'/'+y.slice(2); }
function addDias(iso,n){ const d=new Date(iso+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function diasEntre(a,b){ return Math.max(0,Math.round((new Date(b+'T12:00:00Z')-new Date(a+'T12:00:00Z'))/864e5)); }
function diasDesde(iso){ return Math.max(0, Math.round((new Date(hojeBrasilISO()+'T12:00:00Z')-new Date(iso+'T12:00:00Z'))/864e5)); }
const soDigitos = s => String(s||'').replace(/\D/g,'');
function fmtCNPJ(s){ const d=soDigitos(s); return d.length===14 ? d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5') : (s||'—'); }
function fmtFone(s){ const d=soDigitos(s); return d.length>=10 ? d.replace(/^(\d{2})(\d{4,5})(\d{4})$/,'($1) $2-$3') : (s||'—'); }
const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parseNum(v){ if(typeof v==='number') return v; if(v==null) return NaN; let s=String(v).trim().replace(/R\$|\s/g,''); if(/,\d{1,2}$/.test(s)) s=s.replace(/\./g,'').replace(',','.'); else s=s.replace(/,/g,''); return parseFloat(s); }
function parseData(v){ if(v instanceof Date) return v.toISOString().slice(0,10); if(typeof v==='number'){ const d=new Date(Math.round((v-25569)*864e5)); return d.toISOString().slice(0,10);} const s=String(v||'').trim(); let m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/); if(m){ let y=m[3].length===2?'20'+m[3]:m[3]; return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;} m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[0]; return null; }

/* ===================== regras puras ===================== */
function ultimaCompra(S,itemId){ return S.compras.filter(c=>c.itemId===itemId).sort((a,b)=>b.data.localeCompare(a.data))[0]||null; }
function resumoItem(S,item){
  const compras=S.compras.filter(c=>c.itemId===item.id).sort((a,b)=>a.data.localeCompare(b.data));
  const props=S.propostas.filter(p=>p.itemId===item.id);
  const hoje=hojeBrasilISO(), d90=addDias(hoje,-90);
  const ult=compras[compras.length-1]||null;
  const recentes=props.filter(p=>p.data>=d90);
  const menor90=recentes.length?recentes.reduce((m,p)=>p.preco<m.preco?p:m):null;
  const media90=recentes.length?recentes.reduce((s,p)=>s+p.preco,0)/recentes.length:null;
  // padrão de compra
  let intervalo=null, qtdTipica=null, fornHabitual=null, proxima=null;
  if(compras.length>=2){ const gaps=[]; for(let i=1;i<compras.length;i++) gaps.push(diasEntre(compras[i-1].data,compras[i].data)); intervalo=Math.round(gaps.reduce((a,b)=>a+b,0)/gaps.length); proxima=addDias(ult.data,intervalo); }
  if(compras.length){ const qs=compras.map(c=>c.qtd).sort((a,b)=>a-b); qtdTipica=qs[Math.floor(qs.length/2)]; const cnt={}; compras.forEach(c=>cnt[c.fornId]=(cnt[c.fornId]||0)+1); fornHabitual=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0][0]; }
  const saldo=saldoEstoque(S,item.id);
  const consumoSem=consumoSemanal(S,item.id);
  return {ult,menor90,media90,intervalo,qtdTipica,fornHabitual,proxima,saldo,consumoSem,nCompras:compras.length,nProps:props.length,
    variacao: ult&&menor90? (menor90.preco-ult.preco)/ult.preco*100 : null};
}
function saldoEstoque(S,itemId,obraId){ let s=0; for(const m of S.movimentos){ if(m.itemId!==itemId) continue; if(obraId){ if(m.tipo==='transf'){ if(m.obraId===obraId) s-=m.qtd; if(m.destinoId===obraId) s+=m.qtd; } else if(m.obraId===obraId) s+= (m.tipo==='saida'?-m.qtd: m.tipo==='ajuste'? m.qtd : m.qtd); } else { if(m.tipo==='entrada') s+=m.qtd; else if(m.tipo==='saida') s-=m.qtd; else if(m.tipo==='ajuste') s+=m.qtd; } } return s; }
function consumoSemanal(S,itemId){ const d=addDias(hojeBrasilISO(),-56); const q=S.movimentos.filter(m=>m.itemId===itemId&&m.tipo==='saida'&&m.data>=d).reduce((s,m)=>s+m.qtd,0); return q/8; }
function precoPosto(p){ return p.preco + (p.frete&&p.qtd? p.frete/p.qtd : 0); }
/** Alerta de preço mais baixo: candidato ≤ referência × (1 − margem), últimos 7 dias, mesma unidade (mesmo item). */
function alertasPreco(S){
  const hoje=hojeBrasilISO(), d7=addDias(hoje,-7), out=[]; const ign=S.config.ignorados||{};
  for(const item of S.itens){
    const ult=ultimaCompra(S,item.id); if(!ult) continue;
    const margem=(item.margemAlerta??S.config.margemPadrao??3)/100;
    const cands=S.propostas.filter(p=>p.itemId===item.id&&p.data>=d7&&p.data>ult.data&&p.preco<=ult.preco*(1-margem));
    const porForn={}; for(const p of cands){ if(!porForn[p.fornId]||p.preco<porForn[p.fornId].preco) porForn[p.fornId]=p; }
    for(const p of Object.values(porForn)){
      const key=item.id+'|'+p.fornId; if(ign[key]&&ign[key]>=hoje) continue;
      out.push({tipo:'preco',key,item,prop:p,ref:ult,economia:(ult.preco-p.preco)*(resumoItem(S,item).qtdTipica||ult.qtd||1),pct:(p.preco-ult.preco)/ult.preco*100});
    }
  }
  return out.sort((a,b)=>b.economia-a.economia);
}
function filaRecompra(S){
  const hoje=hojeBrasilISO(), lim=addDias(hoje,15), out=[];
  for(const item of S.itens){ const r=resumoItem(S,item); const abaixoMin=item.estoqueMin!=null&&r.saldo<item.estoqueMin; const proxima=r.proxima&&r.proxima<=lim; if(abaixoMin||proxima) out.push({item,r,motivo:abaixoMin?'estoque':'padrao'}); }
  return out.sort((a,b)=>(a.r.proxima||'9')<(b.r.proxima||'9')?-1:1);
}
function cotacoesPendentes(S){ return S.cotacoes.filter(c=>['enviada','parcial'].includes(c.status)); }
function melhorPorItem(S,cot){ const out={}; for(const it of cot.itens){ const ps=S.propostas.filter(p=>p.cotacaoId===cot.id&&p.itemId===it.itemId); if(ps.length) out[it.itemId]=ps.reduce((m,p)=>precoPosto(p)<precoPosto(m)?p:m); } return out; }
function gastoPorMes(S,n=6){ const hoje=hojeBrasilISO(); const meses=[]; let [y,m]=hoje.split('-').map(Number); for(let i=0;i<n;i++){ meses.unshift(`${y}-${String(m).padStart(2,'0')}`); m--; if(m===0){m=12;y--;} } return meses.map(k=>({mes:k,total:S.compras.filter(c=>c.data.startsWith(k)).reduce((s,c)=>s+c.preco*c.qtd,0)})); }
function csvBR(rows,cols){ const bom='﻿'; const cell=v=>{ let s=v==null?'':String(v); if(typeof v==='number') s=v.toLocaleString('pt-BR',{maximumFractionDigits:4,useGrouping:false}); if(/^[=+\-@]/.test(s)) s="'"+s; return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }; return bom+[cols.map(c=>cell(c.h)).join(';'),...rows.map(r=>cols.map(c=>cell(c.v(r))).join(';'))].join('\r\n'); }
function textoCotacao(S,cot,forn){ const emp=S.config.empresa||'Nossa empresa'; const linhas=cot.itens.map(it=>{ const i=S.itens.find(x=>x.id===it.itemId); const cod=forn&&i?.codigosFornecedor?.[forn.id]; return `• ${i?i.descricao:'?'}${i?.tamanho?' '+i.tamanho:''} — ${fmtNum(it.qtd)} ${i?.unidade||'un'}${cod?' (cód. '+cod+')':''}`; }); return `Olá${forn?.contato?.nome?', '+forn.contato.nome:''}! Aqui é da ${emp}.\nPedido de cotação *${cot.titulo}*${cot.obra?' — obra '+cot.obra:''}:\n\n${linhas.join('\n')}\n\nPor favor, informe preço unitário, prazo de entrega, frete e validade da proposta até ${fmtData(cot.prazo)}.\nObrigado!`; }

<script>
/* ===================== armazenamento ===================== */
let S = {obras:[],itens:[],fornecedores:[],propostas:[],compras:[],cotacoes:[],movimentos:[],config:{}};
let MODE = 'carregando'; // 'db' | 'local' | 'demo'
let DB = null, USER = null, CAN_WRITE = true, UNSUBS=[];
const LS_KEY='cotai.v1';
const store = {
  async put(col,obj){ if(!obj.id) obj.id=uid(); const arr=S[col]; const i=arr.findIndex(x=>x.id===obj.id); if(i>=0) arr[i]=obj; else arr.push(obj);
    if(MODE==='db'){ try{ await DB.collection(col).doc(obj.id).set(obj); }catch(e){ handleDbErr(e); } } else if(MODE==='local'){ saveLocal(); } },
  async del(col,id){ S[col]=S[col].filter(x=>x.id!==id); if(MODE==='db'){ try{ await DB.collection(col).doc(id).delete(); }catch(e){ handleDbErr(e);} } else if(MODE==='local') saveLocal(); },
  async setConfig(patch){ S.config={...S.config,...patch}; if(MODE==='db'){ try{ await DB.doc('config/geral').set(S.config);}catch(e){handleDbErr(e);} } else if(MODE==='local') saveLocal(); }
};
function handleDbErr(e){ console.warn('db',e); if(e&&e.code==='invalid_argument'){ CAN_WRITE=false; toast('Sem permissão para gravar: visualização somente leitura'); render(); } else if(e&&e.code==='quota_exceeded') toast('Base cheia: apague registros antigos'); else toast('Falha ao gravar; tente de novo'); }
function saveLocal(){ try{ localStorage.setItem(LS_KEY,JSON.stringify(S)); }catch(e){} }
function loadLocal(){ try{ const s=localStorage.getItem(LS_KEY); return s?JSON.parse(s):null; }catch(e){ return null; } }
function prefGet(k,d){ try{ const v=localStorage.getItem('cotai.pref.'+k); return v==null?d:JSON.parse(v);}catch(e){return d;} }
function prefSet(k,v){ try{ localStorage.setItem('cotai.pref.'+k,JSON.stringify(v)); }catch(e){} }

async function boot(){
  renderShell(); render();
  let db=null,user=null;
  try{ if(window.claude?.use){ [db,user]=await Promise.all([claude.use('db'),claude.use('user')]); } }catch(e){ db=null; }
  if(db){
    DB=db; USER=user; MODE='db';
    try{ const cw=await user?.can?.('data.write'); if(cw===false) CAN_WRITE=false; }catch(e){}
    // assina cada coleção uma vez
    let pend=COLS.length;
    for(const col of COLS){
      if(col==='config'){ UNSUBS.push(DB.doc('config/geral').onSnapshot(s=>{ S.config=s.exists?{...s.data()}:S.config; afterLoad(--pend<=0); },e=>{ console.warn(e); afterLoad(--pend<=0); })); continue; }
      UNSUBS.push(DB.collection(col).onSnapshot(s=>{ S[col]=s.docs.map(d=>({...d.data(),id:d.id})); afterLoad(--pend<=0); },e=>{ console.warn(e); afterLoad(--pend<=0); }));
    }
  } else {
    const l=loadLocal();
    if(l){ S=l; MODE='local'; } else { S=demoData(); MODE='demo'; }
    render();
  }
}
let loaded=false;
function afterLoad(first){ if(first&&!loaded){ loaded=true; if(!S.itens.length&&!S.fornecedores.length){ demoOverlay=true; } } if(loaded) render(); }
let demoOverlay=false; // base vazia no db: mostra exemplos até o usuário decidir
function dadosAtivos(){ return (MODE==='db'&&demoOverlay) ? demoCache() : S; }
let _demo=null; function demoCache(){ return _demo||(_demo=demoData()); }
async function carregarExemplosNaBase(){ const d=demoData(); for(const col of COLS){ if(col==='config'){ await store.setConfig(d.config); continue; } for(const o of d[col]) await store.put(col,o); } demoOverlay=false; toast('Exemplos carregados na base'); render(); }

function toast(msg){ const t=document.getElementById('toast'); t.innerHTML=`<div class="toast">${esc(msg)}</div>`; clearTimeout(t._t); t._t=setTimeout(()=>t.innerHTML='',2600); }
function sheet(html,onMount){ const o=document.getElementById('overlay'); o.innerHTML=`<div class="sheet" id="sheetbg"><div class="panel" role="dialog" aria-modal="true">${html}</div></div>`; o.querySelector('#sheetbg').addEventListener('click',e=>{ if(e.target.id==='sheetbg') closeSheet(); }); o.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheet); if(onMount) onMount(o.querySelector('.panel')); const f=o.querySelector('input,select,textarea'); if(f&&window.innerWidth>760) f.focus(); }

const fv=(panel,name)=>{ const el=panel.querySelector(`[name="${name}"]`); return el?el.value.trim():''; };

function render(){

  const main=document.getElementById('main'); const D=dadosAtivos();

  else if(MODE==='db'&&demoOverlay) banner=`<div class="banner">Base vazia: mostrando dados de exemplo. <button class="btn" id="bSeed">Carregar exemplos na base</button><button class="btn" id="bZero">Começar do zero</button></div>`;

  const fn={painel:pPainel,itens:pItens,forn:pForn,cot:pCot,est:pEst,alertas:pAlertas,imp:pImp,conf:pConf,item:pItem,fornDet:pFornDet,cotDet:pCotDet}[page]||pPainel;
  main.innerHTML=banner+fn(D);
  main.querySelector('#bZero')?.addEventListener('click',comecarDoZero);

function barChart(data){ const W=520,H=190,pl=56,pb=28,pt=12; const max=Math.max(1,...data.map(d=>d.total)); const step=niceStep(max); const top=Math.ceil(max/step)*step; const bw=(W-pl-10)/data.length; const y=v=>pt+(H-pt-pb)*(1-v/top); let g=''; for(let v=0;v<=top;v+=step) g+=`<line x1="${pl}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v>=1000?fmtNum(v/1000)+' mil':fmtNum(v)}</text>`; const bars=data.map((d,i)=>{ const x=pl+i*bw+bw*0.18, w=bw*0.64, h=H-pb-y(d.total); return `<rect class="bar" x="${x}" y="${y(d.total)}" width="${w}" height="${Math.max(0,h)}" rx="3"><title>${fmtMes(d.mes)}: ${fmtBRL(d.total)}</title></rect><text x="${x+w/2}" y="${H-8}" text-anchor="middle">${fmtMes(d.mes)}</text>`+(i===data.length-1&&d.total>0?`<text x="${x+w/2}" y="${y(d.total)-5}" text-anchor="middle" style="font-weight:600">${fmtNum(d.total/1000,1)} mil</text>`:'');}).join(''); return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gasto por mês"><g class="grid">${g}</g>${bars}</svg>`; }
function niceStep(max){ const raw=max/4; const p=Math.pow(10,Math.floor(Math.log10(raw))); const n=raw/p; return (n<1.5?1:n<3?2:n<7?5:10)*p; }
function sparkline(vals){ if(vals.length<2) return ''; const W=240,H=46,p=4; const mn=Math.min(...vals),mx=Math.max(...vals); const x=i=>p+i*(W-2*p)/(vals.length-1), y=v=>mx===mn?H/2:p+(H-2*p)*(1-(v-mn)/(mx-mn)); return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${vals.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ')}"/><circle cx="${x(vals.length-1)}" cy="${y(vals[vals.length-1])}" r="3.5"/></svg>`; }
function alertaRow(D,a){ return `<div class="row"><div class="stripe good"></div><div class="grow"><div class="t">${esc(a.item.descricao)} <span class="faint">${esc(a.item.tamanho||'')}</span></div><div class="s"><b class="num">${fmtBRL(a.prop.preco)}</b>/${a.item.unidade} em ${esc(nomeF(D,a.prop.fornId))} · ${ORIGENS[a.prop.origem]||a.prop.origem} ${fmtData(a.prop.data)}${a.prop.frete?'':' · <span class="faint">sem frete</span>'}</div><div class="s">Último pago <span class="num">${fmtBRL(a.ref.preco)}</span> em ${fmtData(a.ref.data)} (${esc(nomeF(D,a.ref.fornId))}) · <span class="pill good">${fmtPct(a.pct)}</span> economia ${fmtBRL(a.economia)} na quantidade típica</div><div class="chips" style="margin-top:6px"><button class="chip" data-act="cotarItem" data-item="${a.item.id}">Cotar</button><button class="chip" data-act="comprarProp" data-prop="${a.prop.id}">Registrar compra</button><button class="chip" data-act="ignorar" data-key="${a.key}">Ignorar 30 dias</button>${a.prop.link?`<a class="chip" href="${esc(a.prop.link)}" target="_blank" rel="noopener">Ver oferta</a>`:''}</div></div></div>`; }

  return `<p><a href="#" data-go="forn">← Fornecedores</a></p>`+head(esc(f.nome),esc(f.cidade||''),`<button class="btn" data-act="editForn" data-id="${f.id}">Editar</button>${f.contato?.whatsapp?`<a class="btn primary" href="https://wa.me/55${soDigitos(f.contato.whatsapp)}" target="_blank" rel="noopener">WhatsApp</a>`:''}`)+`
  <div class="grid two">
    <div class="card"><h3>Contato</h3><dl class="kv"><dt>Pessoa</dt><dd>${esc(f.contato?.nome||'—')}</dd><dt>WhatsApp</dt><dd class="num">${fmtFone(f.contato?.whatsapp)} ${f.contato?.whatsapp?`<button class="btn sm ghost" data-copy="${soDigitos(f.contato.whatsapp)}">copiar</button>`:''}</dd><dt>E-mail</dt><dd>${esc(f.contato?.email||'—')} ${f.contato?.email?`<button class="btn sm ghost" data-copy="${esc(f.contato.email)}">copiar</button>`:''}</dd><dt>CNPJ</dt><dd class="num">${fmtCNPJ(f.cnpj)}</dd><dt>Categorias</dt><dd>${(f.categorias||[]).join(', ')||'—'}</dd><dt>Prazo médio</dt><dd>${f.prazoMedio?f.prazoMedio+' dias':'—'}</dd><dt>Pagamento</dt><dd>${esc(f.pagamento||'—')}</dd><dt>Nota interna</dt><dd>${esc(f.nota||'—')}</dd></dl></div>
    <div class="card"><h3>Resumo</h3><dl class="kv"><dt>Compras</dt><dd>${compras.length} · ${fmtBRL(compras.reduce((s,c)=>s+c.preco*c.qtd,0))}</dd><dt>Última</dt><dd>${compras[0]?fmtData(compras[0].data):'—'}</dd><dt>Itens que vende</dt><dd>${itensVend.length}</dd><dt>Preços no histórico</dt><dd>${props.length}</dd></dl></div>
    <div class="card" style="grid-column:1/-1"><h3>Itens e último preço deste fornecedor</h3><div class="tablewrap"><table><thead><tr><th>Item</th><th>Cód. no fornecedor</th><th class="r">Último preço</th><th>Data</th><th class="r">Vs. último pago</th></tr></thead><tbody>${itensVend.map(id=>{ const it=D.itens.find(x=>x.id===id); const p=props.find(x=>x.itemId===id); const u=ultimaCompra(D,id); const v=u?(p.preco-u.preco)/u.preco*100:null; return `<tr class="click" data-go="item" data-id="${id}"><td>${esc(nomeI(D,id))}</td><td>${esc(it?.codigosFornecedor?.[f.id]||'—')}</td><td class="r num">${fmtBRL(p.preco)}</td><td class="num">${fmtData(p.data)}</td><td class="r">${v!=null?`<span class="pill ${v<0?'good':v>0?'bad':''}">${fmtPct(v)}</span>`:'—'}</td></tr>`; }).join('')||'<tr><td colspan="5" class="muted">Nenhum preço ainda.</td></tr>'}</tbody></table></div></div>
  </div>`;
}
</script>
<script>
/* ===================== Cotações ===================== */
function pCot(D){
  if(params.id==='nova'||params.id==='fila'||params.id?.startsWith('item:')){ setTimeout(()=>{ const pre=params.id==='fila'?filaRecompra(D).map(f=>({itemId:f.item.id,qtd:f.r.qtdTipica||1})):params.id?.startsWith('item:')?[{itemId:params.id.slice(5),qtd:resumoItem(D,D.itens.find(i=>i.id===params.id.slice(5))).qtdTipica||1}]:[]; params={}; novaCotacao(D,pre); },0); }
  const st=prefGet('st.cot','abertas'); const hoje=hojeBrasilISO();
  const lista=D.cotacoes.filter(c=>st==='abertas'?['enviada','parcial','rascunho'].includes(c.status):st==='fechadas'?['fechada','cancelada'].includes(c.status):true).sort((a,b)=>b.criadaEm.localeCompare(a.criadaEm));
  const n=k=>D.cotacoes.filter(c=>k==='abertas'?['enviada','parcial','rascunho'].includes(c.status):['fechada','cancelada'].includes(c.status)).length;
  return head('Cotações',`${n('abertas')} em aberto · ${D.cotacoes.filter(c=>['enviada','parcial'].includes(c.status)&&c.prazo<hoje).length} com prazo vencido`,`<button class="btn primary" data-go="cot" data-id="nova">+ Cotação</button>`)+`
  <div class="chips" style="margin-bottom:12px">${[['abertas','Em aberto'],['fechadas','Fechadas'],['todas','Todas']].map(([k,l])=>`<button class="chip" data-st="${k}" aria-pressed="${st===k}">${l} <span class="faint">${k==='todas'?D.cotacoes.length:n(k)}</span></button>`).join('')}</div>
  ${lista.length?`<div class="list">${lista.map(c=>{ const resp=(c.respondidos||[]).length; const venc=c.prazo<hoje&&['enviada','parcial'].includes(c.status); return `<div class="row click" data-go="cotDet" data-id="${c.id}"><div class="stripe ${c.status==='fechada'?'good':venc?'bad':c.status==='parcial'?'warn':'acc'}"></div><div class="grow"><div class="t">${esc(c.titulo)} <span class="faint">· ${esc(nomeO(D,c.obraId))}</span></div><div class="s">${c.itens.length} ${c.itens.length===1?'item':'itens'} · ${resp}/${c.fornecedores.length} responderam · criada ${fmtData(c.criadaEm)} · prazo ${fmtData(c.prazo)}</div></div><span class="pill ${c.status==='fechada'?'good':venc?'bad':c.status==='parcial'?'warn':'acc'}">${venc?'vencida':{rascunho:'rascunho',enviada:'enviada',parcial:'parcial',fechada:'fechada',cancelada:'cancelada'}[c.status]}</span></div>`; }).join('')}</div>`:`<div class="empty">Nenhuma cotação ${st==='abertas'?'em aberto':'aqui'}. Crie uma a partir da fila de recompra ou de um item.</div>`}`;
}
pCot.mount=(m)=>{ m.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{ prefSet('st.cot',b.dataset.st); render(); }); };

function novaCotacao(D,pre=[]){
  if(!D.itens.length){ toast('Cadastre ou importe itens antes de cotar'); return; }
  let itens=pre.map(p=>({...p})); let forns=new Set();
  const sugerir=()=>{ forns=new Set(); for(const it of itens){ D.propostas.filter(p=>p.itemId===it.itemId).forEach(p=>forns.add(p.fornId)); const i=D.itens.find(x=>x.id===it.itemId); Object.keys(i?.codigosFornecedor||{}).forEach(f=>forns.add(f)); } };
  sugerir();
  const draw=()=>{ const panel=document.querySelector('#overlay .panel'); const titulo=panel?fv(panel,'titulo'):''; const obraId=panel?fv(panel,'obraId'):(D.obras[0]?.id||''); const prazo=panel?fv(panel,'prazo'):addDias(hojeBrasilISO(),3);
    sheet(`<header><h2>Nova cotação</h2><button class="btn ghost" data-close>✕</button></header>
    <div class="form"><div class="field"><label>Título</label><input name="titulo" value="${esc(titulo)}" placeholder="Ex.: Estrutura bloco B"></div><div class="field"><label>Obra</label><select name="obraId">${D.obras.map(o=>`<option value="${o.id}" ${o.id===obraId?'selected':''}>${esc(o.nome)}</option>`).join('')}</select></div><div class="field"><label>Prazo de resposta</label><input name="prazo" type="date" value="${prazo}"></div></div>
    <h3 style="margin:14px 0 6px">Itens (${itens.length})</h3>
    <div class="list" id="cotItens">${itens.map((it,k)=>`<div class="row" style="align-items:center"><div class="grow"><div class="t">${esc(nomeI(D,it.itemId))}</div></div><input type="number" step="any" min="0" value="${it.qtd}" data-k="${k}" class="qtd" style="width:90px;border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--surface)" aria-label="Quantidade"><span class="faint">${esc(D.itens.find(i=>i.id===it.itemId)?.unidade||'')}</span><button class="btn sm ghost" data-rm="${k}" aria-label="Remover">✕</button></div>`).join('')}</div>
    <div class="field" style="margin-top:8px"><label>Adicionar item</label><select id="addItem"><option value="">Escolha…</option>${D.itens.filter(i=>!itens.some(x=>x.itemId===i.id)).sort((a,b)=>a.descricao.localeCompare(b.descricao)).map(i=>`<option value="${i.id}">${esc(i.descricao+(i.tamanho?' '+i.tamanho:''))}</option>`).join('')}</select></div>
    <h3 style="margin:14px 0 6px">Fornecedores (${forns.size})</h3><div class="hint" style="margin-bottom:6px">Sugeridos: quem já vendeu ou tem código para estes itens. Toque para incluir ou tirar.</div>
    <div class="chips">${D.fornecedores.map(f=>`<button class="chip" data-f="${f.id}" aria-pressed="${forns.has(f.id)}">${esc(f.nome)}</button>`).join('')}</div>
    <footer><button class="btn" data-close>Cancelar</button><button class="btn primary" id="salvarCot">Criar e enviar</button></footer>`,
    p=>{ p.querySelectorAll('.qtd').forEach(i=>i.oninput=()=>itens[+i.dataset.k].qtd=parseFloat(i.value)||0); p.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ itens.splice(+b.dataset.rm,1); draw(); }); p.querySelector('#addItem').onchange=e=>{ if(e.target.value){ itens.push({itemId:e.target.value,qtd:resumoItem(D,D.itens.find(i=>i.id===e.target.value)).qtdTipica||1}); sugerir(); draw(); } }; p.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ forns.has(b.dataset.f)?forns.delete(b.dataset.f):forns.add(b.dataset.f); b.setAttribute('aria-pressed',forns.has(b.dataset.f)); });
      p.querySelector('#salvarCot').onclick=async()=>{ const t=fv(p,'titulo')||'Cotação '+fmtData(hojeBrasilISO()); if(!itens.length){ toast('Inclua ao menos um item'); return; } if(!forns.size){ toast('Escolha ao menos um fornecedor'); return; } const c={id:uid(),titulo:t,obraId:fv(p,'obraId'),prazo:fv(p,'prazo')||addDias(hojeBrasilISO(),3),status:'enviada',canal:'whatsapp',itens:itens.filter(i=>i.qtd>0),fornecedores:[...forns],criadaEm:hojeBrasilISO(),respondidos:[]}; await store.put('cotacoes',c); closeSheet(); go('cotDet',{id:c.id}); toast('Cotação criada: envie para cada fornecedor'); }; }); };
  draw();
}

function pCotDet(D){
  const c=D.cotacoes.find(x=>x.id===params.id); if(!c) return head('Cotação não encontrada');
  const hoje=hojeBrasilISO(); const melhor=melhorPorItem(D,c); const aberta=['enviada','parcial','rascunho'].includes(c.status);
  const totalMelhor=c.itens.reduce((s,it)=>s+(melhor[it.itemId]?precoPosto(melhor[it.itemId])*it.qtd:0),0);
  const totForn=f=>{ let t=0,n=0; for(const it of c.itens){ const p=D.propostas.find(p=>p.cotacaoId===c.id&&p.itemId===it.itemId&&p.fornId===f); if(p){ t+=precoPosto(p)*it.qtd; n++; } } return {t,n}; };
  return `<p><a href="#" data-go="cot">← Cotações</a></p>`+head(esc(c.titulo),`${esc(nomeO(D,c.obraId))} · criada ${fmtData(c.criadaEm)} · prazo ${fmtData(c.prazo)} ${c.prazo<hoje&&aberta?'<span class="pill bad">vencido</span>':''} · <span class="pill ${c.status==='fechada'?'good':'acc'}">${c.status}</span>`,aberta?`<button class="btn" data-act="exportCot" data-id="${c.id}">Exportar CSV</button><button class="btn danger" data-act="cancelarCot" data-id="${c.id}">Cancelar</button><button class="btn primary" data-act="fecharCot" data-id="${c.id}" ${Object.keys(melhor).length?'':'disabled'}>Fechar com os melhores</button>`:`<button class="btn" data-act="exportCot" data-id="${c.id}">Exportar CSV</button>`)+`
  <div class="grid two">
    <div class="card"><h3>Fornecedores</h3><div class="list">${c.fornecedores.map(f=>{ const F=D.fornecedores.find(x=>x.id===f); const resp=(c.respondidos||[]).includes(f); const {t,n}=totForn(f); const txt=encodeURIComponent(textoCotacao(D,c,F)); return `<div class="row"><div class="stripe ${resp?'good':'warn'}"></div><div class="grow"><div class="t">${esc(F?.nome||'—')}</div><div class="s">${resp?`respondeu ${n}/${c.itens.length} itens · total ${fmtBRL(t)}`:'aguardando resposta'}</div><div class="chips" style="margin-top:6px">${F?.contato?.whatsapp?`<a class="chip" href="https://wa.me/55${soDigitos(F.contato.whatsapp)}?text=${txt}" target="_blank" rel="noopener">Enviar WhatsApp</a>`:''}${F?.contato?.email?`<a class="chip" href="mailto:${esc(F.contato.email)}?subject=${encodeURIComponent('Cotação '+c.titulo)}&body=${txt}">E-mail</a>`:''}<button class="chip" data-copy-text="${esc(textoCotacao(D,c,F))}">Copiar texto</button>${aberta?`<button class="chip" data-act="responder" data-id="${c.id}" data-f="${f}">${resp?'Editar resposta':'Lançar resposta'}</button>`:''}</div></div></div>`; }).join('')}</div></div>
    <div class="card"><h3>Comparativo por item</h3><div class="tablewrap"><table><thead><tr><th>Item</th><th class="r">Qtd</th><th class="r">Último pago</th>${c.fornecedores.map(f=>`<th class="r">${esc(nomeF(D,f).split(' ')[0])}</th>`).join('')}</tr></thead><tbody>${c.itens.map(it=>{ const u=ultimaCompra(D,it.itemId); const m=melhor[it.itemId]; return `<tr><td>${esc(nomeI(D,it.itemId))}</td><td class="r num">${fmtNum(it.qtd)}</td><td class="r num">${u?fmtBRL(u.preco):'—'}</td>${c.fornecedores.map(f=>{ const p=D.propostas.find(p=>p.cotacaoId===c.id&&p.itemId===it.itemId&&p.fornId===f); if(!p) return '<td class="r faint">—</td>'; const best=m&&m.id===p.id; const vs=u?(p.preco-u.preco)/u.preco*100:null; return `<td class="r num" ${best?'style="background:var(--accent-soft);font-weight:700"':''}>${fmtBRL(p.preco)}${p.frete?`<div class="faint">+frete ${fmtBRL(p.frete)}</div>`:''}${vs!=null?`<div><span class="pill ${vs<0?'good':vs>0?'bad':''}">${fmtPct(vs)}</span></div>`:''}</td>`; }).join('')}</tr>`; }).join('')}<tr><td colspan="3" style="font-weight:700">Total (melhor combinação: ${fmtBRL(totalMelhor)})</td>${c.fornecedores.map(f=>{ const {t,n}=totForn(f); return `<td class="r num" style="font-weight:700">${n?fmtBRL(t)+(n<c.itens.length?`<div class="faint">${n}/${c.itens.length} itens</div>`:''):'—'}</td>`; }).join('')}</tr></tbody></table></div><div class="hint">Melhor preço por item destacado em verde. Preço posto considera frete rateado.</div></div>
  </div>
  <div class="card" style="margin-top:12px"><h3>Texto da cotação</h3><div class="pre">${esc(textoCotacao(D,c,null))}</div></div>`;
}
function responderCot(D,c,fornId){
  const F=D.fornecedores.find(f=>f.id===fornId);
  sheet(`<header><h2>Resposta de ${esc(F?.nome||'')}</h2><button class="btn ghost" data-close>✕</button></header><div class="hint" style="margin-bottom:8px">Preço unitário por item. Deixe em branco o que o fornecedor não cotou.</div>
  <div class="list">${c.itens.map(it=>{ const p=D.propostas.find(p=>p.cotacaoId===c.id&&p.itemId===it.itemId&&p.fornId===fornId); const i=D.itens.find(x=>x.id===it.itemId); return `<div class="row" style="align-items:center;flex-wrap:wrap"><div class="grow"><div class="t">${esc(nomeI(D,it.itemId))}</div><div class="s">${fmtNum(it.qtd)} ${i?.unidade||''}</div></div><div class="field" style="width:130px"><label>R$/${i?.unidade||'un'}</label><input type="number" step="0.01" min="0" data-item="${it.itemId}" class="preco" value="${p?p.preco:''}" inputmode="decimal"></div></div>`; }).join('')}</div>
  <div class="form" style="margin-top:10px"><div class="field"><label>Frete total (R$)</label><input name="frete" type="number" step="0.01" min="0" value="${D.propostas.find(p=>p.cotacaoId===c.id&&p.fornId===fornId)?.frete||''}" inputmode="decimal"></div><div class="field"><label>Prazo de entrega (dias)</label><input name="prazoEnt" type="number" min="0" inputmode="numeric"></div><div class="field"><label>Validade da proposta</label><input name="validade" type="date" value="${addDias(hojeBrasilISO(),7)}"></div></div>
  <footer><button class="btn" data-close>Cancelar</button><button class="btn primary" id="ok">Salvar resposta</button></footer>`,p=>{ p.querySelector('#ok').onclick=async()=>{ const frete=parseFloat(fv(p,'frete'))||0; const itensCot=[...p.querySelectorAll('.preco')].filter(i=>i.value!==''); if(!itensCot.length){ toast('Informe ao menos um preço'); return; } const fretePorItem=frete/itensCot.length; let n=0; for(const inp of p.querySelectorAll('.preco')){ const itemId=inp.dataset.item; const old=D.propostas.find(x=>x.cotacaoId===c.id&&x.itemId===itemId&&x.fornId===fornId); if(inp.value===''){ if(old) await store.del('propostas',old.id); continue; } const it=c.itens.find(x=>x.itemId===itemId); await store.put('propostas',{id:old?.id||uid(),itemId,fornId,preco:parseFloat(inp.value),qtd:it.qtd,frete:fretePorItem,data:hojeBrasilISO(),origem:'cotacao',cotacaoId:c.id,validade:fv(p,'validade')||null,prazoEntrega:parseInt(fv(p,'prazoEnt'))||null,link:''}); n++; } const resp=new Set(c.respondidos||[]); resp.add(fornId); const todos=c.fornecedores.every(f=>resp.has(f)); await store.put('cotacoes',{...c,respondidos:[...resp],status:todos?'respondida':'parcial'}); closeSheet(); toast(`${n} ${n===1?'preço lançado':'preços lançados'}`); render(); }; });
}
async function fecharCot(D,c){
  const melhor=melhorPorItem(D,c); const linhas=Object.values(melhor);
  sheet(`<header><h2>Fechar cotação</h2><button class="btn ghost" data-close>✕</button></header><p>Serão registradas <b>${linhas.length}</b> compras com o melhor preço de cada item, e a entrada no estoque da obra <b>${esc(nomeO(D,c.obraId))}</b>.</p><div class="list">${linhas.map(p=>`<div class="row"><div class="grow"><div class="t">${esc(nomeI(D,p.itemId))}</div><div class="s">${esc(nomeF(D,p.fornId))} · ${fmtNum(p.qtd)} × ${fmtBRL(p.preco)} = <b>${fmtBRL(p.preco*p.qtd)}</b></div></div></div>`).join('')}</div><label style="display:flex;gap:8px;align-items:center;margin-top:10px"><input type="checkbox" id="entrada" checked> Dar entrada no estoque agora (desmarque se a entrega vem depois)</label><footer><button class="btn" data-close>Voltar</button><button class="btn primary" id="ok">Confirmar compras</button></footer>`,p=>{ p.querySelector('#ok').onclick=async()=>{ const ent=p.querySelector('#entrada').checked; const hoje=hojeBrasilISO(); for(const pr of linhas){ await store.put('compras',{id:uid(),itemId:pr.itemId,fornId:pr.fornId,obraId:c.obraId,preco:pr.preco,qtd:pr.qtd,data:hoje,propostaId:pr.id,cotacaoId:c.id}); if(ent) await store.put('movimentos',{id:uid(),itemId:pr.itemId,obraId:c.obraId,tipo:'entrada',qtd:pr.qtd,data:hoje,obs:'Compra · '+c.titulo}); } await store.put('cotacoes',{...c,status:'fechada',fechadaEm:hoje}); closeSheet(); toast('Cotação fechada e compras registradas'); render(); }; });
}

/* ===================== Estoque ===================== */
function pEst(D){
  const obra=prefGet('obra.est','');
  const linhas=D.itens.map(i=>({i,saldo:saldoEstoque(D,i.id,obra||undefined),r:resumoItem(D,i)})).filter(l=>obra?l.saldo!==0||D.movimentos.some(m=>m.itemId===l.i.id&&(m.obraId===obra||m.destinoId===obra)):true).sort((a,b)=>{ const am=a.i.estoqueMin!=null&&a.saldo<a.i.estoqueMin, bm=b.i.estoqueMin!=null&&b.saldo<b.i.estoqueMin; if(am!==bm) return am?-1:1; return a.i.descricao.localeCompare(b.i.descricao); });
  const valor=linhas.reduce((s,l)=>s+(l.r.ult?l.r.ult.preco*Math.max(0,l.saldo):0),0);
  const abaixo=linhas.filter(l=>l.i.estoqueMin!=null&&l.saldo<l.i.estoqueMin).length;
  const fila=filaRecompra(D);
  return head('Estoque',`${fmtBRL(valor)} em estoque pelo último preço pago · ${abaixo} ${abaixo===1?'item abaixo':'itens abaixo'} do mínimo`,`<button class="btn" data-act="inventario">Inventário</button><button class="btn primary" data-act="mov">+ Movimento</button>`)+`
  <div class="chips" style="margin-bottom:12px"><button class="chip" data-obra="" aria-pressed="${!obra}">Todas as obras</button>${D.obras.map(o=>`<button class="chip" data-obra="${o.id}" aria-pressed="${obra===o.id}">${esc(o.nome)}</button>`).join('')}</div>
  <div class="grid cols"><div class="card"><h3>Saldos</h3><div class="tablewrap"><table><thead><tr><th>Item</th><th class="r">Saldo</th><th class="r">Mínimo</th><th class="r">Consumo/sem</th><th class="r">Dura</th><th class="r">Valor</th></tr></thead><tbody>${linhas.map(l=>{ const dias=l.r.consumoSem>0?Math.floor(l.saldo/l.r.consumoSem*7):null; const bad=l.i.estoqueMin!=null&&l.saldo<l.i.estoqueMin; return `<tr class="click" data-go="item" data-id="${l.i.id}"><td>${esc(l.i.descricao)} <span class="faint">${esc(l.i.tamanho||'')}</span></td><td class="r num" style="${bad?'color:var(--bad);font-weight:700':''}">${fmtNum(l.saldo)} ${l.i.unidade}</td><td class="r num">${l.i.estoqueMin!=null?fmtNum(l.i.estoqueMin):'—'}</td><td class="r num">${l.r.consumoSem?fmtNum(l.r.consumoSem,1):'—'}</td><td class="r num">${dias!=null?(dias<=7?`<span class="pill bad">${dias} d</span>`:dias<=21?`<span class="pill warn">${dias} d</span>`:dias+' d'):'—'}</td><td class="r num">${l.r.ult?fmtBRL(l.r.ult.preco*Math.max(0,l.saldo)):'—'}</td></tr>`; }).join('')||'<tr><td colspan="6" class="muted">Nenhum item.</td></tr>'}</tbody></table></div></div>

pImp.mount=(m,D)=>{

  bindMapa(D);

function bindMapa(D){ const m=document.getElementById('mapa'); if(!m||!IMP.rows) return; m.querySelectorAll('.mapsel').forEach(s=>s.onchange=()=>IMP.map[s.dataset.col]=s.value); m.querySelector('#previa').onclick=()=>{ const r=prepararImport(D); const box=m.querySelector('#previaBox'); box.innerHTML=`<h3 style="margin:10px 0 6px">Prévia</h3><div class="hint" style="margin-bottom:6px">${r.resumo}</div>${r.avisos.map(a=>`<div class="banner">${esc(a)}</div>`).join('')}<div class="tablewrap"><table><thead><tr><th>Item</th><th>Fornecedor</th><th class="r">Preço</th><th class="r">Qtd</th><th>Data</th><th>Ação</th></tr></thead><tbody>${r.linhas.slice(0,8).map(l=>`<tr><td>${esc(l.item.descricao)} <span class="faint">${esc(l.item.tamanho||'')}</span>${l.itemNovo?' <span class="pill acc">novo</span>':''}</td><td>${l.forn?esc(l.forn.nome)+(l.fornNovo?' <span class="pill acc">novo</span>':''):'—'}</td><td class="r num">${l.preco!=null?fmtBRL(l.preco):'—'}</td><td class="r num">${l.qtd!=null?fmtNum(l.qtd):'—'}</td><td class="num">${fmtData(l.data)}</td><td class="faint">${esc(l.acao)}</td></tr>`).join('')}${r.linhas.length>8?`<tr><td colspan="6" class="faint">… e mais ${r.linhas.length-8}</td></tr>`:''}</tbody></table></div><p><button class="btn primary" id="gravar" ${r.linhas.length?'':'disabled'}>Gravar ${r.linhas.length} linhas</button></p>`; box.querySelector('#gravar').onclick=async()=>{ box.querySelector('#gravar').disabled=true; await gravarImport(D,r); }; }; }
function prepararImport(D){
  const modo=document.getElementById('modo').value, fornPad=document.getElementById('fornPad').value, obraPad=document.getElementById('obraPad').value, dataPad=document.getElementById('dataPad').value||hojeBrasilISO();
  const col=campo=>{ const k=Object.keys(IMP.map).find(k=>IMP.map[k]===campo); return k==null?null:+k; };
  const get=(row,campo)=>{ const k=col(campo); return k==null?'':row[k]; };
  const itensNovos=[],fornNovos=[],linhas=[],avisos=[]; let ign=0;
  const itemPorChave=new Map(); D.itens.forEach(i=>{ if(i.codigo) itemPorChave.set('c:'+norm(i.codigo),i); itemPorChave.set('d:'+norm(i.descricao+' '+(i.tamanho||'')),i); itemPorChave.set('d:'+norm(i.descricao),i); });
  const fornPorChave=new Map(); D.fornecedores.forEach(f=>{ fornPorChave.set('n:'+norm(f.nome),f); if(soDigitos(f.cnpj)) fornPorChave.set('j:'+soDigitos(f.cnpj),f); });
  if(col('descricao')==null&&modo!=='forn'){ avisos.push('Nenhuma coluna marcada como "Descrição do item". Marque uma para continuar.'); return {linhas:[],avisos,resumo:'',modo}; }
  for(const row of IMP.rows){
    const desc=String(get(row,'descricao')||'').trim(); const codigo=String(get(row,'codigo')||'').trim(); const tam=String(get(row,'tamanho')||'').trim();
    let item=null,itemNovo=false;
    if(modo!=='forn'){ if(!desc&&!codigo){ ign++; continue; } item=(codigo&&itemPorChave.get('c:'+norm(codigo)))||itemPorChave.get('d:'+norm(desc+' '+tam))||(!tam&&itemPorChave.get('d:'+norm(desc)))||null; if(!item){ item={id:uid(),codigo,descricao:desc||codigo,tipo:String(get(row,'tipo')||'').trim(),tamanho:tam,unidade:String(get(row,'unidade')||'un').trim()||'un',marca:String(get(row,'marca')||'').trim(),codigosFornecedor:{},estoqueMin:isNaN(parseNum(get(row,'estoqueMin')))?null:parseNum(get(row,'estoqueMin')),linkOnline:String(get(row,'link')||'').trim()}; itemNovo=true; itensNovos.push(item); if(codigo) itemPorChave.set('c:'+norm(codigo),item); itemPorChave.set('d:'+norm(desc+' '+tam),item); itemPorChave.set('d:'+norm(desc),item); } }
    let forn=null,fornNovo=false; const fnome=String(get(row,'fornecedor')||'').trim(), cnpj=soDigitos(get(row,'cnpj'));
    if(fornPad) forn=D.fornecedores.find(f=>f.id===fornPad); else if(fnome||cnpj){ forn=(cnpj&&fornPorChave.get('j:'+cnpj))||fornPorChave.get('n:'+norm(fnome))||null; if(!forn){ forn={id:uid(),nome:fnome||('CNPJ '+cnpj),cnpj,cidade:String(get(row,'cidade')||'').trim(),categorias:[],contato:{nome:String(get(row,'contato')||'').trim(),whatsapp:soDigitos(get(row,'whatsapp')),email:String(get(row,'email')||'').trim()}}; fornNovo=true; fornNovos.push(forn); fornPorChave.set('n:'+norm(forn.nome),forn); if(cnpj) fornPorChave.set('j:'+cnpj,forn); } }
    const preco=parseNum(get(row,'preco')); const qtd=parseNum(get(row,'qtd')); const data=parseData(get(row,'data'))||dataPad; const codForn=String(get(row,'codigoForn')||'').trim(); const saldo=parseNum(get(row,'saldo'));
    let acao='';
    if(modo==='propostas'){ if(isNaN(preco)||!forn){ ign++; continue; } acao='preço no histórico'; }
    else if(modo==='compras'){ if(isNaN(preco)||!forn||isNaN(qtd)){ ign++; continue; } acao='compra + entrada'; }
    else if(modo==='itens'){ acao=itemNovo?'cadastrar item':'atualizar item'; }
    else if(modo==='forn'){ if(!forn){ ign++; continue; } acao=fornNovo?'cadastrar fornecedor':'já existe'; }
    else if(modo==='saldo'){ if(isNaN(saldo)){ ign++; continue; } acao='ajuste de saldo'; }
    linhas.push({item,itemNovo,forn,fornNovo,preco:isNaN(preco)?null:preco,qtd:isNaN(qtd)?null:qtd,data,codForn,saldo:isNaN(saldo)?null:saldo,obraId:obraPad,acao});
  }
  const resumo=`${linhas.length} linhas prontas · ${itensNovos.length} itens novos · ${fornNovos.length} fornecedores novos · ${ign} ignoradas (sem item, preço ou fornecedor)`;
  if(modo==='propostas'&&!fornPad&&col('fornecedor')==null&&col('cnpj')==null) avisos.push('Sem coluna de fornecedor e sem fornecedor padrão: escolha um fornecedor padrão.');
  return {linhas,avisos,resumo,modo,itensNovos,fornNovos,ign};
}
async function gravarImport(D,r){

    if(r.modo==='propostas'){ await store.put('propostas',{id:uid(),itemId:l.item.id,fornId:l.forn.id,preco:l.preco,qtd:l.qtd||1,frete:0,data:l.data,origem:'planilha',validade:null,link:''}); grav++; }
    else if(r.modo==='compras'){ const pid=uid(); await store.put('propostas',{id:pid,itemId:l.item.id,fornId:l.forn.id,preco:l.preco,qtd:l.qtd,frete:0,data:l.data,origem:'planilha'}); await store.put('compras',{id:uid(),itemId:l.item.id,fornId:l.forn.id,obraId:l.obraId,preco:l.preco,qtd:l.qtd,data:l.data,propostaId:pid}); await store.put('movimentos',{id:uid(),itemId:l.item.id,obraId:l.obraId,tipo:'entrada',qtd:l.qtd,data:l.data,obs:'Importado de '+IMP.nome}); grav++; }
    else if(r.modo==='saldo'){ const atual=saldoEstoque(D,l.item.id,l.obraId); const d=l.saldo-atual; if(d){ await store.put('movimentos',{id:uid(),itemId:l.item.id,obraId:l.obraId,tipo:'ajuste',qtd:d,data:l.data,obs:'Saldo importado de '+IMP.nome}); } grav++; }
    else grav++;
  }
  for(const it of tocados.values()) await store.put('itens',it);
  await store.setConfig({importacoes:[...(D.config.importacoes||[]),{data:hoje,arquivo:IMP.nome,modo:r.modo,lidas:IMP.rows.length,gravadas:grav,ignoradas:r.ign}]});
  IMP={rows:null,headers:null,map:{},nome:''}; toast(`${grav} linhas gravadas`); go('itens');
}

/* ===================== Ajustes ===================== */
function pConf(D){
  return head('Ajustes',`Modo de armazenamento: ${MODE==='db'?'base compartilhada (todos que abrem este link veem os mesmos dados)':MODE==='local'?'só neste aparelho':'exemplo'}`)+`
  <div class="grid two">

    <div class="card"><h3>Obras / almoxarifados</h3><div class="list" id="obras">${D.obras.map(o=>`<div class="row" style="align-items:center"><div class="grow t">${esc(o.nome)}</div><button class="btn sm" data-edobra="${o.id}">Renomear</button></div>`).join('')}</div><div class="form" style="margin-top:8px"><div class="field"><label>Nova obra</label><input id="novaObra" placeholder="Nome da obra"></div></div><p><button class="btn" id="addObra">Adicionar obra</button></p></div>
    <div class="card"><h3>Preço online</h3><p class="muted" style="margin:0 0 8px">Nesta versão, preços vistos em sites entram pelo botão "+ Preço visto" no item (com link) ou pela importação de tabela. O robô que lê os links dos itens a cada 6 h entra na fase 2, no servidor. Itens com link cadastrado: <b>${D.itens.filter(i=>i.linkOnline).length}</b>.</p></div>
    <div class="card"><h3>Dados</h3><p class="muted" style="margin:0 0 8px">${D.itens.length} itens · ${D.fornecedores.length} fornecedores · ${D.propostas.length} preços · ${D.compras.length} compras · ${D.movimentos.length} movimentos · ${D.cotacoes.length} cotações</p><div class="chips"><button class="chip" data-act="exportTudo">Exportar tudo (JSON)</button><button class="chip" data-act="exportItens">Itens (CSV)</button><button class="chip" data-act="exportPrecos">Histórico de preços (CSV)</button>${MODE!=='db'?'<button class="chip" id="apagarTudo">Apagar tudo deste aparelho</button>':''}</div><div class="hint" style="margin-top:8px">Exportar abre o conteúdo numa caixa para copiar; o visualizador não permite baixar arquivos direto.</div></div>
  </div>`;
}
pConf.mount=(m,D)=>{ m.querySelector('#salvarConf').onclick=async()=>{ await store.setConfig({empresa:m.querySelector('#cEmp').value.trim(),cnpj:m.querySelector('#cCnpj').value.trim(),margemPadrao:parseFloat(m.querySelector('#cMarg').value)||0}); toast('Ajustes salvos'); render(); }; m.querySelector('#addObra').onclick=async()=>{ const n=m.querySelector('#novaObra').value.trim(); if(!n) return; await store.put('obras',{id:uid(),nome:n}); toast('Obra adicionada'); render(); }; m.querySelectorAll('[data-edobra]').forEach(b=>b.onclick=()=>{ const o=D.obras.find(x=>x.id===b.dataset.edobra); sheet(`<header><h2>Renomear obra</h2><button class="btn ghost" data-close>✕</button></header><div class="field"><label>Nome</label><input name="nome" value="${esc(o.nome)}"></div><footer><button class="btn" data-close>Cancelar</button><button class="btn primary" id="ok">Salvar</button></footer>`,p=>{ p.querySelector('#ok').onclick=async()=>{ await store.put('obras',{...o,nome:fv(p,'nome')||o.nome}); closeSheet(); render(); }; }); }); m.querySelector('#apagarTudo')?.addEventListener('click',()=>{ sheet(`<header><h2>Apagar tudo?</h2><button class="btn ghost" data-close>✕</button></header><p>Remove todos os dados salvos neste aparelho. Não tem volta.</p><footer><button class="btn" data-close>Cancelar</button><button class="btn danger" id="ok">Apagar</button></footer>`,p=>{ p.querySelector('#ok').onclick=()=>{ try{ localStorage.removeItem(LS_KEY);}catch(e){} S=demoData(); MODE='demo'; closeSheet(); go('painel'); }; }); }); };

/* ===================== formulários de cadastro ===================== */
function formItem(D,item){
  const i=item||{codigosFornecedor:{}};
  sheet(`<header><h2>${item?'Editar item':'Novo item'}</h2><button class="btn ghost" data-close>✕</button></header><div class="form">
  <div class="field wide"><label>Descrição</label><input name="descricao" value="${esc(i.descricao||'')}" placeholder="Ex.: Cimento CP II-E-32"></div>
  <div class="field"><label>Tamanho / medida</label><input name="tamanho" value="${esc(i.tamanho||'')}" placeholder="Ex.: saco 50 kg, 10 mm × 12 m"></div>
  <div class="field"><label>Tipo / categoria</label><input name="tipo" list="tipos" value="${esc(i.tipo||'')}"><datalist id="tipos">${[...new Set(D.itens.map(x=>x.tipo).filter(Boolean))].map(t=>`<option value="${esc(t)}">`).join('')}</datalist></div>
  <div class="field"><label>Unidade</label><input name="unidade" value="${esc(i.unidade||'un')}" placeholder="un, sc, m³, kg, br, m"></div>
  <div class="field"><label>Marca</label><input name="marca" value="${esc(i.marca||'')}"></div>
  <div class="field"><label>Código interno</label><input name="codigo" value="${esc(i.codigo||'')}"></div>
  <div class="field"><label>Estoque mínimo</label><input name="estoqueMin" type="number" step="any" inputmode="decimal" value="${i.estoqueMin??''}"></div>
  <div class="field"><label>Margem do alerta (%)</label><input name="margemAlerta" type="number" step="0.5" inputmode="decimal" value="${i.margemAlerta??''}" placeholder="padrão ${D.config.margemPadrao??3}"></div>
  <div class="field wide"><label>Link do produto online (monitor de preço)</label><input name="linkOnline" value="${esc(i.linkOnline||'')}" placeholder="https://"></div>
  <div class="field wide"><label>Códigos nos fornecedores</label>${D.fornecedores.map(f=>`<div style="display:flex;gap:8px;align-items:center;margin-top:4px"><span style="flex:1;min-width:0;font-size:.9rem">${esc(f.nome)}</span><input data-cf="${f.id}" value="${esc(i.codigosFornecedor?.[f.id]||'')}" style="width:120px;border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--surface)" placeholder="código"></div>`).join('')||'<span class="hint">Cadastre fornecedores para informar os códigos.</span>'}</div>
  </div><footer>${item?`<button class="btn danger" id="del">Excluir</button>`:''}<button class="btn" data-close>Cancelar</button><button class="btn primary" id="ok">Salvar</button></footer>`,p=>{ p.querySelector('#ok').onclick=async()=>{ const d=fv(p,'descricao'); if(!d){ toast('Informe a descrição'); return; } const cf={}; p.querySelectorAll('[data-cf]').forEach(x=>{ if(x.value.trim()) cf[x.dataset.cf]=x.value.trim(); }); const o={...i,id:i.id||uid(),descricao:d,tamanho:fv(p,'tamanho'),tipo:fv(p,'tipo'),unidade:fv(p,'unidade')||'un',marca:fv(p,'marca'),codigo:fv(p,'codigo'),estoqueMin:fv(p,'estoqueMin')===''?null:parseFloat(fv(p,'estoqueMin')),margemAlerta:fv(p,'margemAlerta')===''?null:parseFloat(fv(p,'margemAlerta')),linkOnline:fv(p,'linkOnline'),codigosFornecedor:cf}; await store.put('itens',o); closeSheet(); toast('Item salvo'); go('item',{id:o.id}); }; p.querySelector('#del')?.addEventListener('click',()=>{ sheet(`<header><h2>Excluir item?</h2><button class="btn ghost" data-close>✕</button></header><p>${esc(i.descricao)} e seu histórico de preços, compras e movimentos serão removidos.</p><footer><button class="btn" data-close>Cancelar</button><button class="btn danger" id="ok2">Excluir</button></footer>`,q=>{ q.querySelector('#ok2').onclick=async()=>{ for(const c of ['propostas','compras','movimentos']) for(const x of S[c].filter(x=>x.itemId===i.id)) await store.del(c,x.id); await store.del('itens',i.id); closeSheet(); go('itens'); }; }); }); });
}
function formForn(D,forn){
  const f=forn||{contato:{}};
  sheet(`<header><h2>${forn?'Editar fornecedor':'Novo fornecedor'}</h2><button class="btn ghost" data-close>✕</button></header><div class="form">
  <div class="field wide"><label>Nome / razão social</label><input name="nome" value="${esc(f.nome||'')}"></div>
  <div class="field"><label>CNPJ</label><input name="cnpj" value="${esc(f.cnpj||'')}" inputmode="numeric"></div><div class="field"><label>Cidade/UF</label><input name="cidade" value="${esc(f.cidade||'')}"></div>
  <div class="field"><label>Contato</label><input name="cnome" value="${esc(f.contato?.nome||'')}"></div><div class="field"><label>WhatsApp</label><input name="whats" value="${esc(f.contato?.whatsapp||'')}" inputmode="tel" placeholder="82999990000"></div>
  <div class="field wide"><label>E-mail</label><input name="email" type="email" value="${esc(f.contato?.email||'')}"></div>
  <div class="field"><label>Categorias (vírgula)</label><input name="cats" value="${esc((f.categorias||[]).join(', '))}"></div><div class="field"><label>Prazo médio (dias)</label><input name="prazo" type="number" min="0" inputmode="numeric" value="${f.prazoMedio??''}"></div>
  <div class="field"><label>Pagamento usual</label><input name="pag" value="${esc(f.pagamento||'')}" placeholder="28 dias, à vista, Pix"></div><div class="field wide"><label>Nota interna</label><input name="nota" value="${esc(f.nota||'')}"></div>
  </div><footer><button class="btn" data-close>Cancelar</button><button class="btn primary" id="ok">Salvar</button></footer>`,p=>{ p.querySelector('#ok').onclick=async()=>{ const n=fv(p,'nome'); if(!n){ toast('Informe o nome'); return; } const o={...f,id:f.id||uid(),nome:n,cnpj:soDigitos(fv(p,'cnpj')),cidade:fv(p,'cidade'),categorias:fv(p,'cats').split(',').map(s=>s.trim()).filter(Boolean),prazoMedio:parseInt(fv(p,'prazo'))||null,pagamento:fv(p,'pag'),nota:fv(p,'nota'),contato:{nome:fv(p,'cnome'),whatsapp:soDigitos(fv(p,'whats')),email:fv(p,'email')}}; await store.put('fornecedores',o); closeSheet(); toast('Fornecedor salvo'); go('fornDet',{id:o.id}); }; });
}
function formPreco(D,itemId){
  sheet(`<header><h2>Preço visto</h2><button class="btn ghost" data-close>✕</button></header><div class="hint" style="margin-bottom:8px">Um preço de site, tabela ou ligação. Entra no histórico e pode gerar alerta.</div><div class="form"><div class="field wide"><label>Item</label><select name="itemId">${D.itens.map(i=>`<option value="${i.id}" ${i.id===itemId?'selected':''}>${esc(i.descricao+(i.tamanho?' '+i.tamanho:''))}</option>`).join('')}</select></div><div class="field wide"><label>Fornecedor / loja</label><select name="fornId">${D.fornecedores.map(f=>`<option value="${f.id}">${esc(f.nome)}</option>`).join('')}</select></div><div class="field"><label>Preço unitário</label><input name="preco" type="number" step="0.01" inputmode="decimal"></div><div class="field"><label>Origem</label><select name="origem"><option value="online">Online (site)</option><option value="manual">Ligação / balcão</option><option value="tabela">Tabela do fornecedor</option></select></div><div class="field"><label>Data</label><input name="data" type="date" value="${hojeBrasilISO()}"></div><div class="field"><label>Validade</label><input name="validade" type="date"></div><div class="field wide"><label>Link</label><input name="link" placeholder="https://"></div></div><footer><button class="btn" data-close>Cancelar</button><button class="btn primary" id="ok">Salvar</button></footer>`,p=>{ p.querySelector('#ok').onclick=async()=>{ const preco=parseFloat(fv(p,'preco')); if(!preco){ toast('Informe o preço'); return; } if(!fv(p,'fornId')){ toast('Cadastre um fornecedor primeiro'); return; } await store.put('propostas',{id:uid(),itemId:fv(p,'itemId'),fornId:fv(p,'fornId'),preco,qtd:1,frete:0,data:fv(p,'data')||hojeBrasilISO(),origem:fv(p,'origem'),validade:fv(p,'validade')||null,link:fv(p,'link')}); closeSheet(); toast('Preço registrado'); render(); }; });
}
function formCompra(D,itemId,prop){
  const it=D.itens.find(i=>i.id===(prop?prop.itemId:itemId)); const r=it?resumoItem(D,it):null;
  sheet(`<header><h2>Registrar compra</h2><button class="btn ghost" data-close>✕</button></header><div class="form"><div class="field wide"><label>Item</label><select name="itemId" ${prop?'disabled':''}>${D.itens.map(i=>`<option value="${i.id}" ${i.id===(prop?prop.itemId:itemId)?'selected':''}>${esc(i.descricao+(i.tamanho?' '+i.tamanho:''))}</option>`).join('')}</select></div><div class="field wide"><label>Fornecedor</label><select name="fornId">${D.fornecedores.map(f=>`<option value="${f.id}" ${prop&&f.id===prop.fornId?'selected':''}>${esc(f.nome)}</option>`).join('')}</select></div><div class="field"><label>Preço unitário</label><input name="preco" type="number" step="0.01" inputmode="decimal" value="${prop?prop.preco:(r?.ult?.preco||'')}"></div><div class="field"><label>Quantidade</label><input name="qtd" type="number" step="any" inputmode="decimal" value="${prop?.qtd||r?.qtdTipica||''}"></div><div class="field"><label>Obra</label><select name="obraId">${D.obras.map(o=>`<option value="${o.id}">${esc(o.nome)}</option>`).join('')}</select></div><div class="field"><label>Data</label><input name="data" type="date" value="${hojeBrasilISO()}"></div><div class="field wide"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="entrada" checked> Dar entrada no estoque</label></div></div><footer><button class="btn" data-close>Cancelar</button><button class="btn primary" id="ok">Salvar compra</button></footer>`,p=>{ p.querySelector('#ok').onclick=async()=>{ const preco=parseFloat(fv(p,'preco')), qtd=parseFloat(fv(p,'qtd')); if(!preco||!qtd){ toast('Informe preço e quantidade'); return; } const itemId2=p.querySelector('[name=itemId]').value, fornId=fv(p,'fornId'), obraId=fv(p,'obraId'), data=fv(p,'data')||hojeBrasilISO(); let pid=prop?.id; if(!pid){ pid=uid(); await store.put('propostas',{id:pid,itemId:itemId2,fornId,preco,qtd,frete:0,data,origem:'manual'}); } await store.put('compras',{id:uid(),itemId:itemId2,fornId,obraId,preco,qtd,data,propostaId:pid}); if(p.querySelector('[name=entrada]').checked) await store.put('movimentos',{id:uid(),itemId:itemId2,obraId,tipo:'entrada',qtd,data,obs:'Compra'}); closeSheet(); toast('Compra registrada'); render(); }; });
}
function mostrarTexto(titulo,txt){ sheet(`<header><h2>${esc(titulo)}</h2><button class="btn ghost" data-close>✕</button></header><p class="hint">Toque em copiar e cole no Excel ou num arquivo .csv.</p><textarea id="txt" style="width:100%;min-height:260px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface-2);font-family:ui-monospace,monospace;font-size:.8rem">${esc(txt)}</textarea><footer><button class="btn" data-close>Fechar</button><button class="btn primary" data-copy-text="${esc(txt)}">Copiar</button></footer>`); }

/* ===================== ações globais ===================== */
document.addEventListener('click',async e=>{
  const D=dadosAtivos();
  const cp=e.target.closest('[data-copy],[data-copy-text]'); if(cp){ const t=cp.dataset.copyText??cp.dataset.copy; try{ await navigator.clipboard.writeText(t); toast('Copiado'); }catch(err){ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast('Copiado'); }catch(e2){ toast('Selecione e copie manualmente'); } ta.remove(); } return; }
  const b=e.target.closest('[data-act]'); if(!b) return;
  if(MODE==='db'&&!CAN_WRITE&&!['exportItens','exportPrecos','exportTudo','exportCot'].includes(b.dataset.act)){ toast('Somente leitura nesta base'); return; }
  if(MODE==='db'&&demoOverlay&&!b.dataset.act.startsWith('export')){ toast('Carregue os exemplos na base ou comece do zero para editar'); return; }
  const a=b.dataset.act;
  if(a==='novoItem') formItem(D); else if(a==='editItem') formItem(D,D.itens.find(i=>i.id===b.dataset.id));
  else if(a==='novoForn') formForn(D); else if(a==='editForn') formForn(D,D.fornecedores.find(f=>f.id===b.dataset.id));
  else if(a==='precoManual') formPreco(D,b.dataset.id); else if(a==='compraManual') formCompra(D,b.dataset.id);
  else if(a==='comprarProp') formCompra(D,null,D.propostas.find(p=>p.id===b.dataset.prop));
  else if(a==='cotarItem') go('cot',{id:'item:'+b.dataset.item});
  else if(a==='ignorar'){ const ign={...(D.config.ignorados||{})}; ign[b.dataset.key]=addDias(hojeBrasilISO(),30); await store.setConfig({ignorados:ign}); toast('Alerta ignorado por 30 dias'); render(); }
  else if(a==='responder') responderCot(D,D.cotacoes.find(c=>c.id===b.dataset.id),b.dataset.f);
  else if(a==='fecharCot') fecharCot(D,D.cotacoes.find(c=>c.id===b.dataset.id));
  else if(a==='cancelarCot'){ const c=D.cotacoes.find(c=>c.id===b.dataset.id); await store.put('cotacoes',{...c,status:'cancelada'}); toast('Cotação cancelada'); render(); }
  else if(a==='mov') formMov(D,b.dataset.id); else if(a==='inventario') inventario(D);
  else if(a==='exportItens') mostrarTexto('Itens.csv',csvBR(D.itens.map(i=>({i,r:resumoItem(D,i)})),[{h:'Código',v:x=>x.i.codigo},{h:'Descrição',v:x=>x.i.descricao},{h:'Tamanho',v:x=>x.i.tamanho},{h:'Tipo',v:x=>x.i.tipo},{h:'Unidade',v:x=>x.i.unidade},{h:'Marca',v:x=>x.i.marca},{h:'Último preço pago',v:x=>x.r.ult?.preco??''},{h:'Data último',v:x=>x.r.ult?fmtData(x.r.ult.data):''},{h:'Fornecedor habitual',v:x=>nomeF(D,x.r.fornHabitual)},{h:'Menor 90 d',v:x=>x.r.menor90?.preco??''},{h:'Saldo',v:x=>x.r.saldo},{h:'Mínimo',v:x=>x.i.estoqueMin??''}]));
  else if(a==='exportPrecos') mostrarTexto('Precos.csv',csvBR([...D.propostas].sort((a,b)=>b.data.localeCompare(a.data)),[{h:'Data',v:p=>fmtData(p.data)},{h:'Item',v:p=>nomeI(D,p.itemId)},{h:'Fornecedor',v:p=>nomeF(D,p.fornId)},{h:'Preço',v:p=>p.preco},{h:'Qtd',v:p=>p.qtd},{h:'Frete',v:p=>p.frete||0},{h:'Origem',v:p=>ORIGENS[p.origem]||p.origem},{h:'Link',v:p=>p.link||''}]));
  else if(a==='exportCot'){ const c=D.cotacoes.find(c=>c.id===b.dataset.id); const ps=D.propostas.filter(p=>p.cotacaoId===c.id); mostrarTexto('Cotacao.csv',csvBR(c.itens.flatMap(it=>c.fornecedores.map(f=>({it,f,p:ps.find(p=>p.itemId===it.itemId&&p.fornId===f)}))),[{h:'Item',v:x=>nomeI(D,x.it.itemId)},{h:'Qtd',v:x=>x.it.qtd},{h:'Fornecedor',v:x=>nomeF(D,x.f)},{h:'Preço unit.',v:x=>x.p?.preco??''},{h:'Frete',v:x=>x.p?.frete??''},{h:'Total',v:x=>x.p?x.p.preco*x.it.qtd:''},{h:'Último pago',v:x=>ultimaCompra(D,x.it.itemId)?.preco??''}])); }
  else if(a==='exportTudo') mostrarTexto('cotai-backup.json',JSON.stringify(D,null,1));
});
boot();
</script>
